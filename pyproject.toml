[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["chess==1.11.2"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.18",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "ruff>=0.14",
    "torch>=2.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Offline training scratch. None of it ships in the submission.
extend-exclude = ["train.py", "training/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
